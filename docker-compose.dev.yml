version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: collabo_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabo
      POSTGRES_PASSWORD: collabo_pass
      POSTGRES_DB: collabo_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collabo -d collabo_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collabo_redis_dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
