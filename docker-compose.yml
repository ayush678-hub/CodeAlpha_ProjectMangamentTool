version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: collabo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabo
      POSTGRES_PASSWORD: collabo_pass
      POSTGRES_DB: collabo_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U collabo -d collabo_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collabo_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: collabo_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://collabo:collabo_pass@postgres:5432/collabo_db
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: collabo_web
    restart: unless-stopped
    env_file: .env
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
